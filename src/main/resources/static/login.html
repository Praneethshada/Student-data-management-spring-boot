<!DOCTYPE html>
<html lang="en">
<script>(function(){var t=localStorage.getItem('edu-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — EduTrack</title>
  <meta name="description" content="Sign in to your EduTrack institution account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #2563eb;
      --blue-dark:  #1d4ed8;
      --blue-light: #eff6ff;
      --green:      #16a34a;
      --green-light:#f0fdf4;
      --red:        #dc2626;
      --red-light:  #fef2f2;
      --text:       #1e293b;
      --muted:      #64748b;
      --border:     #e2e8f0;
      --bg:         #f8fafc;
      --white:      #ffffff;
    }

    html[data-theme="dark"] {
      --bg:         #0f172a;
      --white:      #1e293b;
      --text:       #f1f5f9;
      --muted:      #94a3b8;
      --border:     #334155;
      --blue-light: rgba(37,99,235,0.18);
      --red-light:  rgba(220,38,38,0.18);
      --green-light:rgba(22,163,74,0.18);
    }

    .theme-btn {
      position: fixed;
      top: 1rem; right: 1rem;
      z-index: 200;
      width: 36px; height: 36px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      transition: background 0.15s;
    }
    .theme-btn:hover { background: var(--blue-light); }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 3rem 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
      color: var(--blue);
      font-weight: 700;
      font-size: 1.1rem;
    }
    .brand-icon {
      width: 34px; height: 34px;
      background: var(--blue);
      color: white;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .card-sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1.8rem;
    }

    .form { display: flex; flex-direction: column; gap: 1rem; }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--text);
    }

    input {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: #aab; }
    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .btn-submit {
      margin-top: 0.4rem;
      padding: 0.7rem;
      background: var(--blue);
      border: none;
      border-radius: 6px;
      color: white;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover:not(:disabled) { background: var(--blue-dark); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-submit .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner   { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      padding: 0.65rem 0.9rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      display: none;
    }
    .alert.show   { display: block; }
    .alert.error  { background: var(--red-light); border: 1px solid #fca5a5; color: var(--red); }
    .alert.success{ background: var(--green-light); border: 1px solid #86efac; color: var(--green); }

    .divider {
      display: flex; align-items: center; gap: 0.8rem;
      margin: 1.5rem 0 1rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .card-footer { text-align: center; font-size: 0.88rem; color: var(--muted); }
    .card-footer a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .card-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <button id="themeToggle" class="theme-btn" title="Toggle theme">🌙</button>

  <a href="/landing.html" class="brand" id="brand-link">
    <div class="brand-icon">🎓</div>
    EduTrack
  </a>

  <div class="card">
    <h1>Sign In</h1>
    <p class="card-sub">Log in to manage your institution's student records.</p>

    <form class="form" id="loginForm" novalidate>
      <label for="email">
        Email
        <input type="email" id="email" name="email" placeholder="admin@example.com" autocomplete="email" required />
      </label>

      <label for="password">
        Password
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
      </label>

      <div class="alert error" id="errorMsg" role="alert"></div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">Sign In</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div class="divider">or</div>

    <div class="card-footer">
      No account? <a href="/register.html" id="register-link">Register your institution →</a>
    </div>
  </div>

  <script>
    // Theme toggle
    (function() {
      var html = document.documentElement;
      var btn  = document.getElementById('themeToggle');
      function sync() { btn.textContent = html.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
      sync();
      btn.addEventListener('click', function() {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('edu-theme', next);
        sync();
      });
    })();

    const form     = document.getElementById('loginForm');
    const btn      = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    fetch('/auth/me').then(r => {
      if (r.ok) window.location.href = '/index.html';
    }).catch(() => {});

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.className = 'alert error show';
    }
    function hideError() { errorMsg.className = 'alert error'; }
    function setLoading(on) {
      btn.disabled = on;
      btn.classList.toggle('loading', on);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) { showError('Please enter your email and password.'); return; }

      setLoading(true);
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (res.ok) {
          window.location.href = '/index.html';
        } else {
          const body = await res.json().catch(() => ({}));
          showError(body.error || 'Invalid email or password.');
        }
      } catch {
        showError('Network error. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
